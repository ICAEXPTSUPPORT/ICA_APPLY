<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ICA Admissions</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Brand tokens — change colors here ===== */
:root{
  --navy:#0B1F3A; --navy-2:#13305B; --navy-3:#1D4277;
  --gold:#C9A24A; --gold-2:#E8C877; --gold-ink:#3A2A05;
  --bg:#F3F5F9; --card:#FFFFFF; --text:#0E1726; --muted:#5B6678; --line:#E2E7EF; --soft:#EEF2F8;
  --ok:#15803D; --ok-bg:#E7F6EC; --warn:#B45309; --warn-bg:#FEF3E2; --bad:#B91C1C; --bad-bg:#FDECEC; --info:#1D4ED8; --info-bg:#E8EEFD;
  --r:18px; --r-sm:12px; --shadow:0 6px 24px rgba(11,31,58,.08); --shadow-lg:0 18px 50px rgba(11,31,58,.18);
  --safe-b:env(safe-area-inset-bottom,0px);
  --font:'Plus Jakarta Sans','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#08111F; --card:#0F1C31; --text:#E7ECF4; --muted:#93A2B8; --line:#1C2C46; --soft:#13233D;
  --ok-bg:#0E2A1A; --warn-bg:#2E1F08; --bad-bg:#2D1013; --info-bg:#0F1E40; --shadow:0 6px 24px rgba(0,0,0,.35);
}
[dir="rtl"]{ --font:'Noto Sans Arabic','Plus Jakarta Sans',system-ui,sans-serif; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;line-height:1.25}
p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
#view{padding-bottom:calc(96px + var(--safe-b));animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:8px;height:56px}
.topbar h2{flex:1;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:18px}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* hero */
.hero{background:radial-gradient(120% 90% at 100% 0%,var(--navy-3) 0%,var(--navy) 55%,#071428 100%);color:#fff;padding:18px 0 34px;position:relative;overflow:hidden;border-radius:0 0 28px 28px}
.hero::before{content:"";position:absolute;inset:auto -60px -90px auto;width:260px;height:260px;border-radius:50%;border:1px solid rgba(232,200,119,.25)}
.hero::after{content:"";position:absolute;inset:-80px auto auto -70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,74,.22),transparent 70%)}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.logo-mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,var(--gold-2),var(--gold));display:grid;place-items:center;color:var(--gold-ink);font-weight:800;font-size:14px;letter-spacing:.5px;overflow:hidden;flex:none}
.logo-mark img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:15px;letter-spacing:.3px}
.brand small{display:block;font-size:12px;color:var(--gold-2);opacity:.95}
.lang-pill{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:600}
.hero h1{font-size:28px;font-weight:800;margin:26px 0 8px;position:relative;z-index:1;letter-spacing:-.3px}
.hero h1 span{color:var(--gold-2)}
.hero p.lead{color:#C9D4E5;font-size:15px;max-width:440px;position:relative;z-index:1}
.hero-cta{display:grid;gap:12px;margin-top:22px;position:relative;z-index:1}
.big-btn{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;font-weight:700;font-size:16px;text-align:start;transition:transform .15s}
.big-btn:active{transform:scale(.98)}
.big-btn .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
.big-btn small{display:block;font-weight:500;font-size:12.5px;opacity:.8;margin-top:1px}
.big-btn.gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--gold-ink);box-shadow:0 10px 26px rgba(201,162,74,.35)}
.big-btn.gold .ico{background:rgba(255,255,255,.35)}
.big-btn.glass{background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.2)}
.big-btn.glass .ico{background:rgba(255,255,255,.12)}
.big-btn .arrow{margin-inline-start:auto;opacity:.7;font-size:18px}

/* sections */
.section{margin-top:22px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-h h3{font-size:16px;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:-18px;position:relative;z-index:2}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;box-shadow:var(--shadow);min-height:78px;color:var(--text)}
.quick button span{font-size:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.trust{display:grid;gap:10px}
.trust .row{display:flex;gap:12px;align-items:flex-start}
.trust .row span{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none}
.trust .row p{font-size:14px;color:var(--muted)}
.trust .row b{display:block;color:var(--text);font-size:14.5px}
.banner{display:flex;gap:12px;align-items:center;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--r);padding:14px;margin-top:16px}
.banner p{flex:1;font-size:14px;font-weight:600}
.banner.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 25%,transparent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15.5px;transition:transform .12s,opacity .2s;width:100%}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--gold-ink)}
.btn-navy{background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn-navy{background:var(--navy-3)}
.btn-ghost{background:var(--card);border:1.5px solid var(--line);color:var(--text)}
.btn-sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:10px;width:auto}
.btn-danger{color:var(--bad)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.link{color:var(--info);font-weight:600;font-size:14px}

/* chips & badges */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--soft);font-size:12.5px;font-weight:600;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px}
.badge.under_review{background:var(--warn-bg);color:var(--warn)}
.badge.accepted{background:var(--ok-bg);color:var(--ok)}
.badge.rejected{background:var(--bad-bg);color:var(--bad)}
.badge.more_docs{background:#FFEDD5;color:#C2410C}
:root[data-theme="dark"] .badge.more_docs{background:#3A1E0B;color:#FDBA74}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:50px;margin:14px 0 10px}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px;min-width:0}

/* university cards */
.uni-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px;animation:fade .3s ease both}
.uni-head{display:flex;gap:12px;align-items:center;padding:16px 16px 10px}
.uni-logo{width:54px;height:54px;border-radius:14px;flex:none;background:linear-gradient(145deg,var(--navy-3),var(--navy));color:var(--gold-2);display:grid;place-items:center;font-weight:800;font-size:16px;overflow:hidden;border:1px solid var(--line)}
.uni-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.uni-head h3{font-size:16.5px;font-weight:700}
.uni-head p{font-size:13.5px;color:var(--muted);margin-top:2px}
.uni-body{padding:0 16px 14px}
.uni-body .desc{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.facts{display:grid;gap:8px;margin:10px 0 2px}
.fact{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.fact .k{flex:none;width:22px;text-align:center}
.fact div{min-width:0}
.fact b{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.fact span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.uni-foot{border-top:1px solid var(--line);padding:12px 16px}

/* details */
.d-hero{background:linear-gradient(160deg,var(--navy-3),var(--navy));color:#fff;border-radius:var(--r);padding:20px;margin-top:14px;position:relative;overflow:hidden}
.d-hero .uni-logo{width:64px;height:64px;border-color:rgba(255,255,255,.2)}
.d-hero h1{font-size:22px;margin-top:14px}
.d-hero p{color:#C9D4E5;font-size:14px;margin-top:4px}
.d-hero .tag{background:rgba(255,255,255,.12);color:#fff}
.d-sec{margin-top:14px}
.d-sec h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.d-sec .txt{font-size:14.5px;color:var(--muted);white-space:pre-line}
.prog{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:start}
.prog:first-of-type{border-top:0;padding-top:4px}
.prog .pi{flex:1;min-width:0}
.prog b{display:block;font-size:14.5px}
.prog small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.prog .go{color:var(--gold);font-weight:700;font-size:13px;flex:none}
.lvl-h{font-size:12.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 2px}
.sticky-cta{position:fixed;inset:auto 0 0 0;z-index:25;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 0 calc(10px + var(--safe-b))}
.sticky-cta .wrap{display:grid;gap:8px}

/* apply */
.progress{display:flex;gap:6px;margin:16px 0 6px}
.progress i{flex:1;height:5px;border-radius:5px;background:var(--line);transition:background .3s}
.progress i.on{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.step-meta{font-size:12.5px;color:var(--muted);font-weight:600}
.step-title{font-size:21px;font-weight:800;margin:4px 0 14px}
.field{display:block;margin-bottom:14px}
.field .lab{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.opt{color:var(--muted);font-weight:500}
.in{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:15.5px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:36px}
[dir="rtl"] select.in{background-position:20px 22px,15px 22px}
.in:focus{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 18%,transparent)}
.in:disabled{opacity:.55}
.has-err .in{border-color:var(--bad)}
.err{color:var(--bad);font-size:12.5px;margin-top:5px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.preset{display:flex;gap:10px;align-items:center;background:var(--info-bg);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:14px;font-size:14px}
.actionbar{position:fixed;inset:auto 0 0 0;z-index:25;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 0 calc(10px + var(--safe-b))}
.actionbar .wrap{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.saved{font-size:12px;color:var(--ok);font-weight:600;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

/* documents */
.doc{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px}
.doc .di{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--soft)}
.doc.ok .di{background:var(--ok-bg)}
.doc.need .di{background:var(--warn-bg)}
.doc .dm{flex:1;min-width:0}
.doc .dm b{display:block;font-size:14.5px}
.doc .dm small{display:block;color:var(--muted);font-size:12.5px;word-break:break-all}
.doc .row-btns{margin-top:10px}
.hint{font-size:13.5px;color:var(--muted);background:var(--soft);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:14px}

/* review */
.rv h4{font-size:13px;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{text-align:end;font-weight:600;word-break:break-word}

/* done */
.done{text-align:center;padding-top:34px}
.done .tick{width:88px;height:88px;border-radius:50%;margin:0 auto 18px;background:linear-gradient(145deg,var(--gold-2),var(--gold));display:grid;place-items:center;font-size:42px;box-shadow:0 14px 34px rgba(201,162,74,.4);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.idbox{background:var(--card);border:1.5px dashed var(--gold);border-radius:var(--r);padding:16px;margin:20px 0 14px}
.idbox b{display:block;font-size:22px;letter-spacing:.5px;margin-top:4px;direction:ltr}

/* bottom nav */
.bnav{position:fixed;inset:auto 0 0 0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.bnav .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:64px;padding:0 6px}
.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.bnav button span{font-size:21px;filter:grayscale(.6);opacity:.75;transition:.2s}
.bnav button.on{color:var(--text)}
.bnav button.on span{filter:none;opacity:1;transform:translateY(-1px)}
.bnav button.on::after{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}

/* sheet, modal, overlay, toast */
.backdrop{position:fixed;inset:0;background:rgba(5,12,24,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;z-index:60;background:var(--card);border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);padding:8px 0 calc(16px + var(--safe-b));box-shadow:var(--shadow-lg)}
.sheet.open{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:12px}
.pages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.pg{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--muted);padding:4px}
.pg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pg .n{position:absolute;bottom:6px;inset-inline-start:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.pg .x{position:absolute;top:5px;inset-inline-end:5px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:13px;display:grid;place-items:center}
.pg .pdf{font-size:30px;display:block;margin-bottom:4px}
.add-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;pointer-events:none}
.modal .box{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:400px;box-shadow:var(--shadow-lg);transform:scale(.94);opacity:0;transition:.2s;pointer-events:auto}
.modal.open .box{transform:none;opacity:1}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{color:var(--muted);font-size:14.5px;margin-bottom:18px}
.modal .stack{display:grid;gap:10px}
.lang-opt{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;width:100%}
.lang-opt.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.overlay{position:fixed;inset:0;z-index:90;background:rgba(5,12,24,.6);display:none;place-items:center;backdrop-filter:blur(3px)}
.overlay.open{display:grid}
.overlay .box{background:var(--card);border-radius:20px;padding:24px 28px;display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:700;min-width:220px;text-align:center}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translate(-50%,20px);z-index:95;background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg);pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
.toast.ok{background:var(--ok)}
.preview{position:fixed;inset:0;z-index:80;background:#1b2230;display:none;flex-direction:column}
.preview.open{display:flex}
.preview .pv-top{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;font-weight:700;font-size:14px}
.preview .icon-btn{background:rgba(255,255,255,.15);border-color:transparent;color:#fff}
.preview .pv-top span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview .pv-body{flex:1;overflow:auto;padding:0 12px 24px}
.preview canvas{width:100%;height:auto;display:block;margin:0 auto 12px;border-radius:6px;background:#fff;max-width:760px}
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%);background-size:300% 100%;animation:sh 1.3s infinite;height:190px;margin-bottom:14px}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty .e{font-size:44px;margin-bottom:10px}
.msg{padding:12px 14px;border-radius:14px;background:var(--soft);margin-bottom:8px;font-size:14px;white-space:pre-line}

.contact a{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text);font-weight:600}
.contact a:last-child{border-bottom:0}
.contact a span{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px}
@media (min-width:560px){.hero h1{font-size:34px}.quick button{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function t(k, v){ let s = (I18N[S.lang] && I18N[S.lang][k]); if (s == null) s = I18N.en[k]; if (s == null) s = k; if (v) s = s.replace(/\{(\w+)\}/g, (m, x) => v[x] != null ? v[x] : m); return s; }
function digits(s){ return String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
function lvlKey(l){ l = String(l || '').toLowerCase(); if (/^(bach|bsc|ba\b|b\.)/.test(l)) return 'bachelor'; if (/^(mast|msc|ma\b|m\.)/.test(l)) return 'master'; if (/^(phd|doct)/.test(l)) return 'phd'; if (/^med|mbbs|md\b|dent|pharm/.test(l)) return 'medical'; return 'other'; }
function uniById(id){ return S.cfg.universities.find(u => u.id === id); }
function progById(id){ return S.cfg.programs.find(p => p.id === id); }
function descOf(u){ return (u.desc && (u.desc[S.lang] || u.desc.en)) || ''; }
function trDoc(m){ const k = DOC_TYPES.find(x => I18N.en['doc_' + x] === m); return k ? t('doc_' + k) : m; }
function docName(d){ return d.type === 'other' && d.label ? d.label : t('doc_' + d.type); }
function pagesTxt(n){ n = Number(n) || 1; return n === 1 ? t('page_1') : t('pages_n', {n}); }
function initials(n){ return String(n || '?').split(/\s+/).filter(w => /^[A-Z]/.test(w)).slice(0, 3).map(w => w[0]).join('') || String(n || '?').slice(0, 2); }

function haptic(k){ try { tg && tg.HapticFeedback && (k === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : k === 'bad' ? tg.HapticFeedback.notificationOccurred('error') : tg.HapticFeedback.impactOccurred('light')); } catch(e){} }

/* storage: Telegram CloudStorage (syncs across devices) + localStorage fallback */
const ls = { get:k => { try { return localStorage.getItem(k); } catch(e){ return null; } }, set:(k,v) => { try { localStorage.setItem(k, v); } catch(e){} }, del:k => { try { localStorage.removeItem(k); } catch(e){} } };
const cloudOK = () => { try { return !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')); } catch(e){ return false; } };
const store = {
  get(k){ return new Promise(res => { if (!cloudOK()) return res(ls.get(k)); let done = false; const fin = v => { if (!done){ done = true; res(v); } }; setTimeout(() => fin(ls.get(k)), 1500); try { tg.CloudStorage.getItem(k, (e, v) => fin(!e && v ? v : ls.get(k))); } catch(e){ fin(ls.get(k)); } }); },
  set(k, v){ ls.set(k, v); if (cloudOK()) try { tg.CloudStorage.setItem(k, v, () => {}); } catch(e){} },
  del(k){ ls.del(k); if (cloudOK()) try { tg.CloudStorage.removeItem(k, () => {}); } catch(e){} }
};

/* =================== API =================== */
class AppError extends Error { constructor(key, data){ super(key); this.key = key; this.data = data; } }
const ERR = { auth:'e_auth', size:'e_size', format:'e_format', type:'e_format' };
async function api(action, data){
  if (IS_DEMO) return demoApi(action, data || {});
  if (!tg || !tg.initData) throw new AppError('e_auth');
  let res, j;
  try { res = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify(Object.assign({ action, initData: tg.initData }, data || {})) }); }
  catch(e){ throw new AppError('e_network'); }
  try { j = await res.json(); } catch(e){ throw new AppError('e_generic'); }
  if (!j.ok) throw new AppError(ERR[j.error] || 'e_generic', j);
  return j;
}
async function demoApi(action, d){
  await sleep(450);
  if (action === 'init') return { ok:true, universities:DEMO.universities, programs:DEMO.programs, applications:S.demoApps, draftDocs:S.draftDocs };
  if (action === 'uploadDoc'){
    const doc = { id:'D' + Date.now(), type:d.type, label:d.label, name:(d.appId ? d.appId + '_' : '') + d.name + '_' + (d.label || t('doc_' + d.type)).replace(/\W+/g, '_') + '.pdf', pages:d.pages, sizeKb:Math.round(d.data.length * .75 / 1024) };
    if (d.appId){ const a = S.demoApps.find(x => x.id === d.appId); a.documents.push(doc); a.missing = a.missing.filter(m => m !== d.forItem); return { ok:true, doc, applications:S.demoApps }; }
    return { ok:true, doc };
  }
  if (action === 'submit'){
    const f = d.form, u = uniById(f.university), p = progById(f.program), id = 'ICA-' + new Date().getFullYear() + '-' + String(S.demoApps.length + 1).padStart(6, '0');
    const have = S.draftDocs.map(x => x.type);
    S.demoApps.unshift({ id, submitted:new Date().toISOString().slice(0,10), status:'under_review', university:u.name, program:p.name, degree:p.level, intake:f.intake, documents:S.draftDocs.slice(), missing:(p.docs || []).filter(x => !have.includes(x)).map(x => I18N.en['doc_' + x]), messages:[] });
    return { ok:true, appId:id, applications:S.demoApps };
  }
  if (action === 'getDoc') throw new AppError('e_generic');
  return { ok:true };
}
async function loadData(silent){
  try {
    const r = await api('init');
    S.cfg = { universities:r.universities || [], programs:r.programs || [] };
    S.apps = r.applications || []; S.draftDocs = r.draftDocs || []; S.loaded = true; S.loadError = '';
  } catch(e){ S.loadError = e.key || 'e_load'; if (!silent) toast(t(S.loadError), 'bad'); }
  render();
}

const cur = () => S.stack[S.stack.length - 1];
function go(v, p){ S.stack.push(Object.assign({ v }, p || {})); S.errors = {}; render(true); haptic(); }
function resetTo(v, p){ S.stack = [{ v:'home' }]; if (v !== 'home') S.stack.push(Object.assign({ v }, p || {})); S.errors = {}; render(true); haptic(); }
function back(){
  if ($('#modal').classList.contains('open')) return closeModal(null);
  if (S.sheet) return closeSheet();
  if ($('#preview').classList.contains('open')) return closePreview();
  const c = cur();
  if (c.v === 'apply' && S.draft.step > 1){ S.draft.step--; S.errors = {}; saveDraft(); return render(true); }
  if (c.v === 'done'){ return resetTo('home'); }
  if (S.stack.length > 1){ S.stack.pop(); render(true); } 
}
function syncTelegramChrome(){
  if (!tg) return;
  try {
    const showBack = S.stack.length > 1 || !!S.sheet;
    if (tg.BackButton){ showBack ? tg.BackButton.show() : tg.BackButton.hide(); }
    if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')){ (cur().v === 'apply' && S.draft.started) ? tg.enableClosingConfirmation() : tg.disableClosingConfirmation(); }

function resolveProgram(){
  const f = S.draft.form, U = S.cfg.universities;
  const countries = [...new Set(U.map(u => u.country).filter(Boolean))];
  if (!f.country && countries.length === 1) f.country = countries[0];
  const unis = U.filter(u => !f.country || u.country === f.country);
  if (f.university && !unis.some(u => u.id === f.university)) f.university = '';
  if (!f.university && unis.length === 1) f.university = unis[0].id;
  const progs = S.cfg.programs.filter(p => p.uni === f.university);
  const levels = [...new Set(progs.map(p => lvlKey(p.level)))].sort((a, b) => LEVELS.indexOf(a) - LEVELS.indexOf(b));
  if (f.degree_level && !levels.includes(f.degree_level)) f.degree_level = '';
  if (!f.degree_level && levels.length === 1) f.degree_level = levels[0];
  const plist = progs.filter(p => lvlKey(p.level) === f.degree_level);
  if (f.program && !plist.some(p => p.id === f.program)) f.program = '';
  if (!f.program && plist.length === 1) f.program = plist[0].id;
  const p = progById(f.program), u = uniById(f.university);
  const intakes = p ? (p.intakes && p.intakes.length ? p.intakes : (u ? u.intakes : [])) : [];
  if (f.intake && !intakes.includes(f.intake)) f.intake = '';
  if (!f.intake && intakes.length === 1) f.intake = intakes[0];
  return { countries, unis, levels, plist, intakes };
}

function validateStep(n){
  const e = {}, f = S.draft.form;
  (FIELDS[n] || []).forEach(x => {
    const v = String(f[x.k] || '').trim();
    if (x.req && !v) e[x.k] = 'err_required';
    else if (v && x.v === 'phone' && !/^\+?[\d\s()\-]{7,20}$/.test(v)) e[x.k] = 'err_phone';
    else if (v && x.v === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) e[x.k] = 'err_email';
    else if (v && x.v === 'year' && !(/^\d{4}$/.test(v) && +v > 1960 && +v <= new Date().getFullYear() + 1)) e[x.k] = 'err_year';
  });
  if (n === 3) ['country','university','degree_level','program','intake'].forEach(k => { if (!f[k]) e[k] = 'err_required'; });
  S.errors = e; return !Object.keys(e).length;
}

/* =================== document sheet (photos/PDF → one PDF) =================== */
function openSheet(o){ S.sheet = Object.assign({ pages:[], type:'', label:'' }, o); if (!S.sheet.type) S.sheet.chooseType = true; renderSheet(); syncTelegramChrome(); }
function closeSheet(){ if (S.sheet) S.sheet.pages.forEach(p => p.thumb && URL.revokeObjectURL(p.thumb)); S.sheet = null; renderSheet(); syncTelegramChrome(); }
function renderSheet(){
  const el = $('#sheet'), bd = $('#backdrop'), sh = S.sheet;
  if (!sh){ el.classList.remove('open'); bd.classList.remove('open'); return; }
  const title = sh.forItem || (sh.type && !sh.chooseType ? t('doc_' + sh.type) : t('doc_add_other'));
  el.innerHTML = `<div class="grab"></div><div class="wrap">
    <h3>${DOC_ICON[sh.type] || '📎'} ${esc(title)}</h3>
    ${sh.chooseType ? `<label class="field"><span class="lab">${t('which_doc')}</span><select class="in" data-sk="type"><option value="">${t('select')}</option>${DOC_TYPES.map(d => `<option value="${d}" ${sh.type === d ? 'selected' : ''}>${t('doc_' + d)}</option>`).join('')}</select></label>` : ''}
    ${sh.type === 'other' ? `<label class="field"><span class="lab">${t('doc_label')}</span><input class="in" data-sk="label" value="${esc(sh.label)}" maxlength="60"></label>` : ''}
    <p class="hint">💡 ${t('docs_hint')}</p>
    ${sh.pages.length ? `<div class="pages">${sh.pages.map((p, i) => `<div class="pg">${p.thumb ? `<img src="${p.thumb}" alt="">` : `<div><span class="pdf">📄</span>${esc(p.file.name.slice(0, 24))}</div>`}<span class="n">${i + 1}</span><button class="x" data-act="pageRemove" data-i="${i}">✕</button></div>`).join('')}</div>` : ''}
    <div class="add-row">
      <label class="btn btn-ghost filebtn">📷 ${t('take_photo')}<input type="file" accept="image/*" capture="environment" data-file="1"></label>
      <label class="btn btn-ghost filebtn">📁 ${t('choose_files')}<input type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" multiple data-file="1"></label>
    </div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px"><button class="btn btn-ghost" data-act="closeSheet">${t('cancel')}</button><button class="btn btn-gold" data-act="saveSheet" ${sh.pages.length ? '' : 'disabled'}>✅ ${t('save_doc')}</button></div>
  </div>`;
  el.classList.add('open'); bd.classList.add('open');
}
function addFiles(input){
  const sh = S.sheet; if (!sh) return;
  for (const file of Array.from(input.files || [])){
    const name = file.name.toLowerCase();
    const isPdf = file.type === 'application/pdf' || name.endsWith('.pdf');
    const isImg = /^image\/(jpeg|jpg|png)$/.test(file.type) || /\.(jpe?g|png)$/.test(name);
    if (!isPdf && !isImg){ toast(t('e_format'), 'bad'); continue; }
    if (file.size > 20 * 1048576){ toast(t('e_size', {n:20}), 'bad'); continue; }
    sh.pages.push({ file, kind:isPdf ? 'pdf' : 'img', thumb:isPdf ? null : URL.createObjectURL(file) });
  }
  input.value = ''; renderSheet();
}
function loadScript(urls){
  return new Promise((res, rej) => {
    const tryAt = i => { if (i >= urls.length) return rej(new Error('script')); const s = document.createElement('script'); s.src = urls[i]; s.onload = () => res(urls[i]); s.onerror = () => { s.remove(); tryAt(i + 1); }; document.head.appendChild(s); };
    tryAt(0);
  });
}
async function ensurePdfLib(){ if (!window.PDFLib) await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js','https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js','https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js']); }
async function imageToJpeg(file){
  let src;
  try { src = await createImageBitmap(file, { imageOrientation:'from-image' }); }
  catch(e){ src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight, max = 2480, sc = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  return new Uint8Array(await blob.arrayBuffer());
}
async function buildPdf(pages, type){
  await ensurePdfLib();
  const { PDFDocument } = window.PDFLib;
  if (pages.length === 1 && pages[0].kind === 'pdf'){          // single PDF → keep original, no re-encoding
    const bytes = new Uint8Array(await pages[0].file.arrayBuffer());
    let n = 1; try { n = (await PDFDocument.load(bytes, { ignoreEncryption:true })).getPageCount(); } catch(e){}
    return { bytes, pages:n };
  }
  const out = await PDFDocument.create();
  for (const p of pages){
    if (p.kind === 'pdf'){
      const src = await PDFDocument.load(await p.file.arrayBuffer(), { ignoreEncryption:true });
      (await out.copyPages(src, src.getPageIndices())).forEach(pg => out.addPage(pg));
    } else {
      const img = await out.embedJpg(await imageToJpeg(p.file));
      let W, H;
      if (type === 'photo'){ const s = 595 / Math.max(img.width, img.height); W = img.width * s; H = img.height * s; }
      else { [W, H] = img.width > img.height ? [842, 595] : [595, 842]; }      // A4
      const s = Math.min(W / img.width, H / img.height), w = img.width * s, h = img.height * s;
      out.addPage([W, H]).drawImage(img, { x:(W - w) / 2, y:(H - h) / 2, width:w, height:h });
    }
  }
  return { bytes: await out.save(), pages: out.getPageCount() };
}
function toB64(u8){ let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function fromB64(b){ const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function saveSheet(){
  const sh = S.sheet; if (!sh || !sh.pages.length) return;
  if (!sh.type){ toast(t('which_doc'), 'bad'); return; }
  if (sh.type === 'other' && !sh.label && !sh.forItem){ toast(t('doc_label'), 'bad'); return; }
  overlay(t('processing'));
  let built;
  try { built = await buildPdf(sh.pages, sh.type); }
  catch(e){ console.error(e); hideOverlay(); toast(t('e_process'), 'bad'); haptic('bad'); return; }
  if (built.bytes.length > CONFIG.MAX_MB * 1048576){ hideOverlay(); toast(t('e_size', {n:CONFIG.MAX_MB}), 'bad'); return; }
  overlay(t('uploading'));
  try {
    const r = await api('uploadDoc', { type:sh.type, label:sh.label || (sh.type === 'other' ? sh.forItem : '') || '', pages:built.pages, data:toB64(built.bytes), name:studentName(), appId:sh.appId || '', forItem:sh.forItem || '', replaceId:sh.replaceId || '' });
    S.pdfCache[r.doc.id] = built.bytes;
    if (sh.appId){ if (r.applications) S.apps = r.applications; }
    else { S.draftDocs = S.draftDocs.filter(d => d.id !== sh.replaceId).concat(r.doc); S.draft.started = true; saveDraft(); }
    closeSheet(); render(); toast('✅ ' + docName(r.doc), 'ok'); haptic('ok');
  } catch(e){ toast(t(e.key || 'e_generic', {n:CONFIG.MAX_MB}), 'bad'); haptic('bad'); }
  finally { hideOverlay(); }
}
async function removeDoc(id){
  const c = await choice(t('confirm_remove'), '', [{k:'y', l:'🗑 ' + t('yes_remove'), cls:'btn-navy'}, {k:'n', l:t('cancel'), cls:'btn-ghost'}]);
  if (c !== 'y') return;
  overlay(t('loading'));
  try { await api('deleteDoc', { docId:id }); S.draftDocs = S.draftDocs.filter(d => d.id !== id); render(); }
  catch(e){ toast(t(e.key || 'e_generic'), 'bad'); } finally { hideOverlay(); }
}
async function previewDoc(id){
  overlay(t('loading'));
  try {
    let bytes = S.pdfCache[id];
    if (!bytes){ const r = await api('getDoc', { docId:id }); bytes = fromB64(r.data); S.pdfCache[id] = bytes; }
    if (!window.pdfjsLib){
      const u = await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js']);
      pdfjsLib.GlobalWorkerOptions.workerSrc = u.replace('pdf.min.js', 'pdf.worker.min.js');
    }
    const pdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    const all = S.draftDocs.concat(...S.apps.map(a => a.documents)), d = all.find(x => x.id === id);
    const pv = $('#preview');
    pv.innerHTML = `<div class="pv-top"><span>📄 ${esc(d ? d.name : '')}</span><button class="icon-btn" data-act="closePreview">✕</button></div><div class="pv-body" id="pvBody"></div>`;
    pv.classList.add('open'); hideOverlay(); syncTelegramChrome();
    const body = $('#pvBody'), width = Math.min(body.clientWidth || 360, 760), dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (let i = 1; i <= Math.min(pdf.numPages, 20); i++){
      const page = await pdf.getPage(i), vp0 = page.getViewport({ scale:1 }), vp = page.getViewport({ scale: width / vp0.width * dpr });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; body.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  } catch(e){ console.error(e); hideOverlay(); toast(t(e.key || 'e_generic'), 'bad'); }
}
function closePreview(){ const pv = $('#preview'); pv.classList.remove('open'); pv.innerHTML = ''; syncTelegramChrome(); }

/* =================== modal / toast / overlay =================== */
let modalResolve;
function choice(title, text, btns){
  return new Promise(res => {
    modalResolve = res;
    const m = $('#modal');
    m.innerHTML = `<div class="box"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : '<p></p>'}<div class="stack">${btns.map(b => `<button class="btn ${b.cls || 'btn-ghost'}" data-act="modalPick" data-k="${b.k}">${esc(b.l)}</button>`).join('')}</div></div>`;
    $('#backdrop').classList.add('open'); requestAnimationFrame(() => m.classList.add('open'));
  });
}
function closeModal(v){ $('#modal').classList.remove('open'); if (!S.sheet) $('#backdrop').classList.remove('open'); setTimeout(() => { if (!$('#modal').classList.contains('open')) $('#modal').innerHTML = ''; }, 200); const r = modalResolve; modalResolve = null; r && r(v); }
function langPicker(){
  const m = $('#modal');
  m.innerHTML = `<div class="box"><h3>🌐 ${t('choose_lang')}</h3><p></p><div class="stack">${Object.keys(I18N).map(k => `<button class="lang-opt ${S.lang === k ? 'on' : ''}" data-act="setLang" data-l="${k}"><span>${I18N[k]._name}</span>${S.lang === k ? '✓' : ''}</button>`).join('')}</div></div>`;
  $('#backdrop').classList.add('open'); requestAnimationFrame(() => m.classList.add('open'));
}
let toastT;
function toast(msg, kind){ const el = $('#toast'); el.textContent = msg; el.className = 'toast show ' + (kind || ''); clearTimeout(toastT); toastT = setTimeout(() => el.className = 'toast', 3200); }
function overlay(txt){ $('#overlayText').textContent = txt; $('#overlay').classList.add('open'); }
function hideOverlay(){ $('#overlay').classList.remove('open'); }

/* =================== events =================== */
const ACT = {
  back: () => back(),
  tab: el => { if (el.dataset.v === 'my' && S.loaded) loadData(true); resetTo(el.dataset.v); },
  go: el => go(el.dataset.v),
  openApply: () => openApply(),
  uni: el => go('uni', { id:el.dataset.id }),
  country: el => { S.country = el.dataset.c; render(); },
  applyUni: el => applyUni(el.dataset.id, el.dataset.p),
  next: () => nextStep(),
  toStep: el => { S.draft.step = +el.dataset.s; saveDraft(); render(true); },
  submit: () => submitApp(),
  addDoc: el => openSheet({ type:el.dataset.type || '' }),
  replaceDoc: el => { const d = S.draftDocs.find(x => x.id === el.dataset.id); openSheet({ type:d.type, label:d.label || '', replaceId:d.id }); },
  removeDoc: el => removeDoc(el.dataset.id),
  previewDoc: el => previewDoc(el.dataset.id),
  closePreview: () => closePreview(),
  addAppDoc: el => openSheet({ appId:el.dataset.id, forItem:el.dataset.item || '', type:el.dataset.item ? 'other' : '', label:el.dataset.item || '', chooseType:true }),
  pageRemove: el => { const p = S.sheet.pages.splice(+el.dataset.i, 1)[0]; p && p.thumb && URL.revokeObjectURL(p.thumb); renderSheet(); },
  closeSheet: () => closeSheet(),
  saveSheet: () => saveSheet(),
  openMyApp: el => { if (S.apps.length > 1 || cur().v === 'done') go('myapp', { id:el.dataset.id }); else resetTo('my'); },
  refresh: async () => { overlay(t('loading')); await loadData(); hideOverlay(); },
  reload: () => { S.loadError = ''; render(); loadData(); },
  lang: () => langPicker(),
  setLang: el => { S.lang = el.dataset.l; store.set('ica_lang', S.lang); closeModal(); render(); },
  modalPick: el => closeModal(el.dataset.k),
  ext: (el, e) => { if (tg && tg.openLink){ e.preventDefault(); const u = el.dataset.url; /^https:\/\/t\.me\//.test(u) && tg.openTelegramLink ? tg.openTelegramLink(u) : tg.openLink(u); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el){ ACT[el.dataset.act] && ACT[el.dataset.act](el, e); return; }
  if (e.target.id === 'backdrop'){ if ($('#modal').classList.contains('open')) closeModal(null); else if (S.sheet) closeSheet(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'uniSearch'){ S.q = el.value; const l = $('#uniList'); if (l) l.innerHTML = uniListHTML(); return; }
  if (el.dataset.sk && S.sheet){ S.sheet[el.dataset.sk] = el.value; if (el.dataset.sk === 'type') renderSheet(); return; }
  if (el.dataset.k && el.tagName !== 'SELECT'){
    let v = el.value; if (['phone','grad_year'].includes(el.dataset.k)){ const d = digits(v); if (d !== v){ v = d; el.value = d; } }
    S.draft.form[el.dataset.k] = v; S.draft.started = true;
    if (S.errors[el.dataset.k]){ delete S.errors[el.dataset.k]; const f = el.closest('.field'); f && f.classList.remove('has-err'); const er = f && f.querySelector('.err'); er && er.remove(); }
    saveDraft();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.file) return addFiles(el);
  if (el.dataset.sk && S.sheet){ S.sheet[el.dataset.sk] = el.value; renderSheet(); return; }
  if (el.dataset.k && el.tagName === 'SELECT'){
    const k = el.dataset.k, f = S.draft.form; f[k] = el.value; S.draft.started = true; delete S.errors[k];
    const chain = ['country','university','degree_level','program','intake'], i = chain.indexOf(k);
    if (i >= 0){ chain.slice(i + 1).forEach(x => { f[x] = ''; delete S.errors[x]; }); S.draft.preUni = k === 'university' || k === 'country' ? '' : S.draft.preUni; render(); }
    else { const fl = el.closest('.field'); fl && fl.classList.remove('has-err'); const er = fl && fl.querySelector('.err'); er && er.remove(); }
    saveDraft();
  }
});

/* =================== start =================== */
(async function start(){
  if (tg){
    try {
      tg.ready(); tg.expand();
      if (tg.isVersionAtLeast('6.1')){ tg.setHeaderColor('#0B1F3A'); tg.setBackgroundColor(tg.colorScheme === 'dark' ? '#08111F' : '#F3F5F9'); }
      if (tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      tg.BackButton && tg.BackButton.onClick(back);
      tg.onEvent && tg.onEvent('themeChanged', () => document.documentElement.dataset.theme = tg.colorScheme);
    } catch(e){}
    document.documentElement.dataset.theme = tg.colorScheme === 'dark' ? 'dark' : 'light';
  }
  $('#dl_countries').innerHTML = COUNTRIES.map(c => `<option value="${c}">`).join('');
  const [lang, draft] = await Promise.all([store.get('ica_lang'), store.get('ica_draft')]);
  const tl = String(tgUser.language_code || navigator.language || 'en').toLowerCase();
  S.lang = I18N[lang] ? lang : tl.startsWith('ar') ? 'ar' : (tl.startsWith('ku') || tl === 'ckb') ? 'ckb' : 'en';
  try { if (draft){ const d = JSON.parse(draft); if (d && d.form) S.draft = Object.assign({ step:1, form:{}, started:false }, d); } } catch(e){}
  if (!S.draft.form.telegram && tgUser.username) S.draft.form.telegram = '@' + tgUser.username;
  // deep links: t.me/<bot>/<app>?startapp=uni_<id>  or  startapp=apply
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('startapp') || '';
  render();
  await loadData(true);
  if (/^uni_/.test(sp) && uniById(sp.slice(4))) go('uni', { id:sp.slice(4) });
  else if (sp === 'apply') openApply();
})();
